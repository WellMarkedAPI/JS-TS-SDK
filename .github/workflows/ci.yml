name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # vitest 4 imports node:util's styleText, added in Node 20.12, so the
      # runner cannot start on 18. The LIBRARY still supports Node >=18.17
      # (see package.json engines), and that floor stays covered here by
      # install + typecheck + build; only the test runner is skipped.
      - name: Test (vitest requires Node >= 20)
        if: matrix.node != '18'
        run: npm test
      - run: npm run build
